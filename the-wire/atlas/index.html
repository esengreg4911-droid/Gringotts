<!doctype html>
<html lang="zh-CN">
<head>
 <base href="/the-wire/atlas/">
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="description" content="沿着人物与关系，走进巴尔的摩。按观看进度探索《火线》五季人物地图。">
 <meta name="theme-color" content="#eceae3"><title>火线 · 人物地图 / The Wire Atlas</title>
 <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
 <script src="data.js" defer></script><script src="i18n-en.js" defer></script><script src="app.js" defer></script>
</head>
<body>
 <header class="topbar">
  <div class="brand"><span class="wordmark">THE WIRE<span class="wiremark"></span></span><span class="brand-sub">人物地图<span>THE BALTIMORE CONNECTIONS</span></span></div>
  <nav class="main-nav" aria-label="视图"><button class="nav-button active" data-view="map"><span>◎</span> 关系地图</button><button class="nav-button" data-view="directory"><span>▦</span> 人物名录</button></nav>
  <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索姓名、别名、演员…" autocomplete="off" aria-label="搜索人物"><kbd>/</kbd></label>
 </header>
 <div class="app-shell">
  <aside class="sidebar">
   <div class="atlas-toolbar"><button id="languageToggle" class="atlas-language" type="button" aria-label="Switch to English">EN</button></div>
   <div class="section-label">01 <span>观看进度</span></div>
   <div class="season-tabs" aria-label="季数"><button data-season="1" class="selected" aria-current="true">S1</button><button data-season="2" aria-current="false">S2</button><button data-season="3" aria-current="false">S3</button><button data-season="4" aria-current="false">S4</button><button data-season="5" aria-current="false">S5</button></div>
   <label class="select-label" for="episodeSelect">已看完第一季</label>
   <select id="episodeSelect" aria-label="已看完的集数"></select>
   <div class="episode-caption" id="episodeCaption"></div>
   <div class="section-label">02 <span>人物所属</span><button id="resetFilters" class="text-button">重置</button></div>
   <div id="groupFilters" class="group-filters"></div>
   <div class="section-label">03 <span>关系类型</span></div>
   <div id="typeFilters" class="type-filters"></div>
   <label class="toggle-line"><span>显示更多配角<small>地图逐层展开</small></span><input type="checkbox" id="secondaryToggle"><span class="switch" aria-hidden="true"></span></label>
   <div class="sidebar-summary"><div class="counts"><strong id="peopleCount">—</strong><span>位人物</span><i></i><strong id="edgeCount">—</strong><span>条联系</span></div><p id="scopeLabel"></p></div>
  </aside>
  <main class="workspace">
   <div class="board-actions"><button id="clearFocus" hidden>退出人物聚焦 ×</button><button id="clearSearch" hidden>清除搜索 ×</button></div>
   <section class="map-stage" id="mapStage" aria-label="人物关系地图，拖动平移，使用按钮或滚轮缩放">
    <svg id="network" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="人物关系图"><defs id="svgDefs"></defs><g id="world"><g id="groupLayer"></g><g id="edgeLayer"></g><g id="nodeLayer"></g></g></svg>
    <div class="map-watermark">BALTIMORE<br><span>MARYLAND · 39°17′N 76°37′W</span></div>
    <div class="map-help">拖动平移 <span>·</span> 滚轮缩放 <span>·</span> 点击人物查看关系</div>
    <div class="zoom-controls"><button id="zoomIn" aria-label="放大">+</button><span id="zoomLabel">100%</span><button id="zoomOut" aria-label="缩小">−</button><button id="fitMap" aria-label="适应画面" title="适应画面">⛶</button></div>
    <div id="mapEmpty" class="empty-state" hidden><span>◎</span><h3>当前条件下没有人物</h3><p>试试其他名字，或重置所属筛选。</p><button class="primary-button" id="emptyReset">重置筛选</button></div>
   </section>
   <section id="directory" class="directory" aria-label="人物名录" hidden></section>
  </main>
  <aside id="detailPanel" class="detail-panel" aria-label="人物详情"></aside>
 </div>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
